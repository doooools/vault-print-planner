# Checks every pull request (and every push to main, which GitHub Pages publishes): index.html is the build of src/,
# validate.js finds no problem, the page's scripts parse, and no mesh file was committed. Same checks locally:
# python -I tools/check.py
name: Check the page

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and check
        run: python -I tools/check.py
